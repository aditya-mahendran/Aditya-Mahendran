# Create the app in one paste: https://api.slack.com/apps → Create New App → From an app manifest.
display_information:
  name: Peter Panel
  description: KCC 2026 panel planning — log panelist outreach without opening Excel.
  background_color: "#2e7d32"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Peter Panel
    always_online: true
  slash_commands:
    - command: /panel
      description: Pick your panel, add or update panelists, see status
      usage_hint: "pick | add | update [name] | list | find <name> | status | help"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      - im:write
      # Free-text updates: "@Peter Panel talked to …" in channels, and DMs to the bot
      - app_mentions:read
      - im:history
      # 👀 while reading a message, ✅ once it's saved
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
